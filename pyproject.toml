[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ospilot"
version = "0.1.0"
description = "Desktop cursor companion for pi-coding-agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "PyYAML>=6.0",
  "pynput>=1.8",
  "comtypes>=1.4; platform_system == 'Windows'",
  "mss>=9.0; platform_system == 'Windows'",
  "Pillow>=10.0; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.gui-scripts]
ospilot = "ospilot.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ospilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

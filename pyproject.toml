[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ospilot"
version = "0.1.0"
description = "macOS cursor companion for pi-coding-agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "PyYAML>=6.0",
  "pynput>=1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
ospilot = "ospilot.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ospilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
